name: ModsTest live tests only
on:
  workflow_dispatch:
    inputs:
      world_id:
        description: Exact ModsTest world ID (optional when configured on server or Environment)
        type: string
        default: ''
      token_ids:
        description: Two fixture token IDs, caster first (optional when configured in Environment)
        type: string
        default: ''
      create_fixtures:
        description: Import two temporary SRD actors/tokens, test them and remove only these fixtures
        type: boolean
        default: false
      diagnostics_only:
        description: Inventory this runner account's browser processes without Foundry login or changes
        type: boolean
        default: false
      recover_only:
        description: Restore pending fixture journals only, without importing actors or running HUD tests
        type: boolean
        default: false
      inspect_sources:
        description: Read-only SRD Socket and document-wrapper diagnostics (no actor import or HUD test)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: modstest-deployment
  cancel-in-progress: false
jobs:
  live-test:
    if: github.ref == 'refs/heads/main'
    environment: modstest
    runs-on: [self-hosted, linux, x64, modstest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inventory runner browser processes (read-only, no login)
        run: python3 tools/runner_browser_inventory.py
      - name: Prepare test metadata (no deployment permissions or enablement needed)
        if: ${{ !inputs.diagnostics_only }}
        env:
          FOUNDRY_WORLD_ID: ${{ inputs.world_id || vars.FOUNDRY_WORLD_ID }}
          MODSTEST_TOKEN_IDS: ${{ inputs.token_ids || vars.MODSTEST_TOKEN_IDS }}
          MODSTEST_CREATE_FIXTURES: ${{ inputs.create_fixtures }}
          MODSTEST_RECOVER_ONLY: ${{ inputs.recover_only }}
          MODSTEST_SOURCE_PROBE: ${{ inputs.inspect_sources }}
        run: python3 tools/live_test_config.py
      - run: npm --prefix e2e ci --ignore-scripts --no-audit --no-fund
        if: ${{ !inputs.diagnostics_only }}
      - name: Install browser as the restricted runner account
        if: ${{ !inputs.diagnostics_only }}
        working-directory: e2e
        run: |
          npx --no-install playwright install chromium
          node browser-smoke.mjs
      - name: Test installed module and restore fixtures
        if: ${{ !inputs.diagnostics_only }}
        id: live
        env:
          MODSTEST_LIVE_ENABLED: 'true'
          FOUNDRY_GM_PASSWORD: ${{ secrets.FOUNDRY_GM_PASSWORD }}
          # Missing/empty is intentional for this existing passwordless account.
          FOUNDRY_PLAYER_PASSWORD: ${{ secrets.FOUNDRY_PLAYER_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          if not os.environ.get('FOUNDRY_GM_PASSWORD'):
              raise SystemExit('Missing modstest Environment Secret: FOUNDRY_GM_PASSWORD')
          PY
          npm --prefix e2e test
      - name: Upload sanitized test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modstest-tests-only-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            e2e/results/report.json
            e2e/results/runner-browser-inventory.json
          if-no-files-found: warn
          retention-days: 7
