name: Build and deploy ModsTest
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: modstest-deployment
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check && npm test
      - run: npm run test:deploy && npm run test:modstest-deploy
      - name: Validate live test discovery (no server login)
        run: npm --prefix e2e ci --ignore-scripts --no-audit --no-fund && cd e2e && npx --no-install playwright test --list
      - run: CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)" npm run test:browser
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: modstest-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  deploy-and-test:
    needs: build
    # Never execute PRs or a manually selected feature branch on a private runner.
    if: github.ref == 'refs/heads/main' && vars.MODS_TEST_ENABLED == 'true'
    environment: modstest
    runs-on: [self-hosted, linux, x64, modstest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: modstest-${{ github.sha }}
          path: dist
      - name: Check exact build artifacts
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Install pinned live test tools
        run: npm --prefix e2e ci --ignore-scripts --no-audit --no-fund
      - name: Install browser (OS dependencies must be provisioned by administrator)
        working-directory: e2e
        run: npx --no-install playwright install chromium
      - name: Deploy, verify, or restore previous module
        id: live
        env:
          FOUNDRY_URL: ${{ vars.FOUNDRY_URL }}
          FOUNDRY_WORLD_ID: ${{ vars.FOUNDRY_WORLD_ID }}
          MODSTEST_TOKEN_IDS: ${{ vars.MODSTEST_TOKEN_IDS }}
          MODSTEST_STATE_DIR: /srv/bg3-modstest-deploy/test-state
          FOUNDRY_GM_PASSWORD: ${{ secrets.FOUNDRY_GM_PASSWORD }}
          FOUNDRY_PLAYER_PASSWORD: ${{ secrets.FOUNDRY_PLAYER_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          required = ['FOUNDRY_URL', 'FOUNDRY_WORLD_ID', 'MODSTEST_TOKEN_IDS',
                      'FOUNDRY_GM_PASSWORD', 'FOUNDRY_PLAYER_PASSWORD']
          if any(not os.environ.get(name) for name in required):
              raise SystemExit('Configure all ModsTest Environment variables and Secrets before deploying')
          PY
          archive_sha=$(sha256sum dist/bg3-video-hud.zip | cut -d ' ' -f 1)
          python3 tools/deploy_modstest.py --zip dist/bg3-video-hud.zip --sha256 "$archive_sha"
      - name: Upload sanitized live report only
        if: always() && (steps.live.outcome == 'success' || steps.live.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: modstest-live-${{ github.sha }}-${{ github.run_attempt }}
          path: e2e/results/report.json
          if-no-files-found: warn
          retention-days: 7
