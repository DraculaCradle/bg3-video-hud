name: Verify public v0.1.21 downloads
on:
  push:
    branches: ['release/v0.1.21']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'DraculaCradle/bg3-video-hud'
    runs-on: ubuntu-24.04
    steps:
      - name: Read the same public update URL Foundry uses
        run: |
          curl --fail --silent --show-error --location --max-time 40 \
            "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/module.json" \
            --output module.json --write-out 'Latest manifest HTTP %{http_code}\n'
          for asset in bg3-video-hud.zip deploy_linux.py SHA256SUMS; do
            curl --fail --silent --show-error --location --max-time 60 \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/v0.1.21/$asset" --output "$asset"
          done
          sha256sum --check SHA256SUMS
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile
          public = json.loads(Path("module.json").read_bytes())
          assert public["version"] == "0.1.21"
          assert public["compatibility"]["verified"] == "14.370"
          assert public["relationships"]["systems"][0]["compatibility"]["verified"] == "6.1.1"
          with ZipFile("bg3-video-hud.zip") as archive:
              assert archive.testzip() is None
              assert json.loads(archive.read("module.json")) == public
          print("Public update manifest and ZIP match v0.1.21")
          PY
